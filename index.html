<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caterva — Página de Rolagens de Traço</title>
  <style>
    :root {
      --acid: #9dff00;
      --acid-bright: #c7ff42;
      --acid-deep: #3e7900;
      --ink: #050706;
      --panel: #0d120e;
      --steel: #253029;
      --muted: #94a197;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; overflow-x: hidden; color: #ecf6df;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 48%, rgba(94, 179, 0, .18), transparent 25rem),
        radial-gradient(circle at 15% 5%, #202720 0%, transparent 23rem),
        repeating-linear-gradient(126deg, rgba(255,255,255,.016) 0 1px, transparent 1px 6px),
        var(--ink);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .34;
      background-image: radial-gradient(rgba(255,255,255,.12) .7px, transparent .9px);
      background-size: 5px 5px; mix-blend-mode: overlay;
    }
    .page { width: min(100%, 1050px); margin: auto; padding: 35px 24px 40px; text-align: center; }
    header { position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 8px; color: var(--acid); font-size: .72rem; letter-spacing: .31em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.035em; text-transform: uppercase; text-shadow: 0 0 18px rgba(157,255,0,.24); }
    .subtitle { margin: 12px auto 0; max-width: 38rem; color: var(--muted); letter-spacing: .08em; font-size: .9rem; }

    main { display: grid; place-items: center; min-height: 650px; position: relative; }
    .reactor {
      position: absolute; width: min(88vw, 600px); aspect-ratio: 1; border-radius: 50%;
      border: 1px solid rgba(157,255,0,.35); opacity: .78;
      background: radial-gradient(circle, rgba(149,255,0,.10), transparent 55%);
      box-shadow: 0 0 0 14px rgba(9,13,10,.8), 0 0 0 15px #263127, 0 0 0 27px #080c09, 0 0 0 28px rgba(157,255,0,.23), inset 0 0 55px #000;
    }
    .reactor::before, .reactor::after { content:""; position:absolute; inset: 27px; border: 9px double rgba(151,255,25,.35); border-radius: inherit; }
    .reactor::after { inset: 57px; border: 1px dashed rgba(202,255,105,.42); animation: turn 22s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .slot { position:absolute; width: 52px; height: 52px; border: 1px solid var(--acid); background: #10180b; box-shadow: 0 0 20px rgba(157,255,0,.42), inset 0 0 16px #000; transform: rotate(45deg); }
    .slot:nth-of-type(1) { top: 1%; left: calc(50% - 26px); }
    .slot:nth-of-type(2) { right: 6%; top: 25%; }
    .slot:nth-of-type(3) { right: 6%; bottom: 25%; }
    .slot:nth-of-type(4) { bottom: 1%; left: calc(50% - 26px); }
    .slot:nth-of-type(5) { left: 6%; bottom: 25%; }
    .slot:nth-of-type(6) { left: 6%; top: 25%; }

    .console { position: relative; z-index: 1; display: grid; justify-items: center; gap: 23px; width: min(92vw, 470px); }
    .die-button { border: 0; background: transparent; cursor: pointer; padding: 12px; -webkit-tap-highlight-color: transparent; }
    .die {
      width: 190px; aspect-ratio: 1; display: grid; place-items: center; transform: rotate(30deg); transition: filter .2s;
      border: 2px solid var(--acid-bright); border-radius: 27px;
      background: linear-gradient(145deg, #294d0c, #071000 52%, #172d09);
      box-shadow: 0 0 0 7px #0b100b, 0 0 0 8px #516041, 0 0 34px 8px rgba(145,255,0,.48), inset 0 0 24px rgba(180,255,51,.32);
    }
    .die::after { content:""; width: 136px; height: 136px; border: 1px solid rgba(218,255,138,.72); border-radius: 16px; background: radial-gradient(circle at 30% 30%, rgba(205,255,88,.30), transparent 35%); }
    .pips { position:absolute; width: 115px; height:115px; z-index: 1; transform: rotate(-30deg); display: grid; grid-template-columns: repeat(3,1fr); align-items:center; justify-items:center; }
    .pip { width: 18px; height:18px; border-radius:50%; background: var(--acid-bright); box-shadow: 0 0 14px 4px var(--acid), inset 0 0 3px white; }
    .pip:nth-child(1) { grid-column:1; grid-row:1; }.pip:nth-child(2) {grid-column:3;grid-row:1}.pip:nth-child(3){grid-column:2;grid-row:2}.pip:nth-child(4){grid-column:1;grid-row:3}.pip:nth-child(5){grid-column:3;grid-row:3}
    .die-button:hover .die { filter: brightness(1.28); }
    .die-button:focus-visible { outline: 2px solid white; outline-offset: 7px; border-radius: 12px; }
    .rolling .die { animation: roll .7s cubic-bezier(.2,.8,.25,1); }
    @keyframes roll { 20% { transform: rotate(140deg) scale(.82); } 60% { transform: rotate(285deg) scale(1.12); } 100% { transform: rotate(390deg); } }
    .instruction { margin: -8px 0 0; color: #b7c4b9; font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; }
    .result-panel { width:100%; min-height: 143px; padding: 21px; position:relative; border: 1px solid #40523b; background: linear-gradient(100deg, rgba(15,25,14,.95), rgba(3,7,4,.92)); box-shadow: inset 0 0 25px #000, 0 10px 30px #0008; clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px); }
    .result-label { color: var(--acid); font-size:.67rem; letter-spacing:.24em; text-transform: uppercase; }
    #result { margin: 11px 0 4px; min-height: 39px; font-size: clamp(1.45rem, 5vw, 2.25rem); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 14px rgba(160,255,0,.8); }
    #detail { margin: 0; min-height: 20px; color: var(--muted); font-size: .83rem; }
    .roll-button { padding: 13px 32px; border: 1px solid var(--acid-bright); color:#0d1607; background: var(--acid); font-weight: 900; font-size:.78rem; letter-spacing: .19em; text-transform: uppercase; cursor:pointer; box-shadow: 0 0 22px rgba(157,255,0,.43); transition: transform .2s, background .2s; clip-path: polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); }
    .roll-button:hover { background: var(--acid-bright); transform: translateY(-2px); }.roll-button:active{transform:translateY(1px)}.roll-button:focus-visible{outline:2px solid white;outline-offset:4px}
    footer { color:#647067; font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; }
    @media (max-width: 520px) { main { min-height: 585px; } .die{width:154px;border-radius:22px}.die::after{width:110px;height:110px}.pips{width:94px;height:94px}.pip{width:14px;height:14px}.reactor{width: 92vw}.slot{width:35px;height:35px}.console{gap:18px} }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">Sistema de determinação</p>
      <h1>Caterva</h1>
      <p class="subtitle">Página de rolagens de traço · Ative o núcleo e descubra a sua manifestação.</p>
    </header>
    <main>
      <div class="reactor" aria-hidden="true"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div>
      <section class="console" aria-label="Rolagem de traço">
        <button class="die-button" id="dieButton" aria-label="Rolar o dado"><span class="die"><span class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></span></button>
        <p class="instruction">Clique no dado para iniciar</p>
        <div class="result-panel" aria-live="polite">
          <div class="result-label">Traço identificado</div>
          <div id="result">Aguardando rolagem</div>
          <p id="detail">O núcleo está pronto para selecionar.</p>
        </div>
        <button class="roll-button" id="rollButton">Rolar traço</button>
      </section>
    </main>
    <footer>Caterva // Núcleo de traços v1.0</footer>
  </div>
  <script>
    const traits = [
      ['Super Corpo', 'Força e resistência além dos limites comuns.'],
      ['Aceleração', 'Velocidade explosiva para dominar cada movimento.'],
      ['Manipulação de Radiação', 'Controle energético de alta intensidade.'],
      ['Camuflagem', 'Presença reduzida até se tornar quase invisível.'],
      ['Adaptação', 'Evolução imediata diante de qualquer cenário.'],
      ['Voo', 'Liberdade total para cruzar os céus.']
    ];
    const dieButton = document.querySelector('#dieButton');
    const rollButton = document.querySelector('#rollButton');
    const result = document.querySelector('#result');
    const detail = document.querySelector('#detail');
    let rolling = false;
    function roll() {
      if (rolling) return;
      rolling = true;
      dieButton.classList.add('rolling');
      result.textContent = 'Calculando...';
      detail.textContent = 'A matriz de traços está em movimento.';
      setTimeout(() => {
        const [trait, description] = traits[Math.floor(Math.random() * traits.length)];
        result.textContent = trait;
        detail.textContent = description;
        dieButton.classList.remove('rolling');
        rolling = false;
      }, 700);
    }
    dieButton.addEventListener('click', roll);
    rollButton.addEventListener('click', roll);
  </script>
</body>
</html>
